<svg viewBox="0 0 920 198" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A221B"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <linearGradient id="pCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <rect width="920" height="198" rx="18" fill="#000000"/>

  <!-- Left Flagship Card: AgroClimate -->
  <rect x="14" y="10" width="440" height="178" rx="15" fill="url(#pCard)" stroke="url(#pBorder)" stroke-width="1.2"/>
  <text x="34" y="38" fill="#C8A273" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.5">01 // HIGH-THROUGHPUT TELEMETRY</text>
  <text x="434" y="38" text-anchor="end" fill="#68625D" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5">PUBLIC REPO ↗</text>

  <text x="34" y="68" fill="#F5F5F4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="18">AgroClimate — Telemetry War Room</text>
  <text x="34" y="94" fill="#9C958E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5">Real-time microclimate sensor ingestion, early anomaly detection,</text>
  <text x="34" y="113" fill="#9C958E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5">and live incident management engineered for continuous stream load.</text>

  <line x1="34" y1="138" x2="434" y2="138" stroke="#1A1816" stroke-width="1"/>
  <text x="34" y="162" fill="#DFBA8B" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11">.NET 10 · Channels + SqlBulkCopy · Columnstore · SignalR</text>

  <!-- Right Flagship Card: SmartField & LabShare -->
  <rect x="466" y="10" width="440" height="178" rx="15" fill="url(#pCard)" stroke="url(#pBorder)" stroke-width="1.2"/>
  <text x="486" y="38" fill="#C8A273" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.5">02 // SPATIAL GIS &amp; HARDWARE FLEET</text>
  <text x="886" y="38" text-anchor="end" fill="#68625D" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="10.5">PUBLIC REPOS ↗</text>

  <text x="486" y="68" fill="#F5F5F4" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="18">SmartField · LabShare · AgroFleet</text>
  <text x="486" y="94" fill="#9C958E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5">Specification rule engines, spatial GIS field passports, shared</text>
  <text x="486" y="113" fill="#9C958E" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5">scientific equipment &amp; drone scheduling, and live fleet dispatch.</text>

  <line x1="486" y1="138" x2="886" y2="138" stroke="#1A1816" stroke-width="1"/>
  <text x="486" y="162" fill="#DFBA8B" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11">EF Core + Dapper · Spatial &amp; Temporal SQL · HTMX + Leaflet</text>
</svg>
